<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedido · Pastifício Fregonesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --frost:#E8EDEA; --frost-deep:#D6DEDA; --ink:#0E2A2B; --ink-soft:#5C6B66;
  --label:#F7F5EF; --yolk:#E3B23C; --stamp:#A32E1E; --line:#C3CDC8; --r:3px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--frost);color:var(--ink);font-family:'Instrument Sans',system-ui,sans-serif;
  font-size:16px;line-height:1.45;padding-bottom:120px;-webkit-font-smoothing:antialiased}
.wrap{max-width:620px;margin:0 auto;padding:0 18px}

.fh{padding:34px 0 20px;border-bottom:1px solid var(--line)}
.fh__mark{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;
  font-size:clamp(38px,11vw,58px);line-height:.88;letter-spacing:-.035em;text-transform:uppercase}
.fh__sub{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-soft);margin-top:12px}
.fh__freezer{margin-top:18px;display:flex;align-items:baseline;gap:9px;
  font-family:'DM Mono',monospace;font-size:12.5px;color:var(--ink-soft)}
.fh__freezer b{font-size:19px;color:var(--ink);font-weight:500}

.nav{position:sticky;top:0;z-index:20;background:var(--frost);border-bottom:1px solid var(--line);
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav__in{display:flex;gap:7px;padding:11px 18px;max-width:620px;margin:0 auto;width:max-content;min-width:100%}
.nav button{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  white-space:nowrap;background:none;border:1px solid var(--line);color:var(--ink-soft);
  padding:6px 11px;border-radius:var(--r);cursor:pointer}
.nav button:hover{border-color:var(--ink);color:var(--ink)}
.nav button:focus-visible{outline:2px solid var(--yolk);outline-offset:2px}

.sec{padding-top:32px;scroll-margin-top:56px}
.sec__hd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.sec__name{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:23px;letter-spacing:-.015em}
.sec__meta{font-family:'DM Mono',monospace;font-size:11px;color:var(--ink-soft)}

.item{background:var(--label);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 14px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;
  gap:12px;align-items:center;transition:border-color .15s}
.item--picked{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--yolk)}
.item--out{opacity:.42;background:var(--frost-deep)}
.item__nm{font-weight:500;font-size:15.5px;line-height:1.25}
.item__ln{margin-top:5px;font-family:'DM Mono',monospace;font-size:11.5px;color:var(--ink-soft);
  display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.item__pr{color:var(--ink);font-weight:500}
.dot{width:3px;height:3px;border-radius:50%;background:var(--line);flex:0 0 auto}
.low{color:var(--stamp)}
.gone{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--stamp);color:var(--stamp);padding:2px 6px;border-radius:2px}

.stp{display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.stp button{width:36px;height:36px;background:none;border:none;cursor:pointer;font-size:19px;
  line-height:1;color:var(--ink);font-family:'DM Mono',monospace}
.stp button:disabled{color:var(--line);cursor:not-allowed}
.stp button:focus-visible{outline:2px solid var(--yolk);outline-offset:-2px}
.stp__n{font-family:'DM Mono',monospace;font-size:15px;min-width:26px;text-align:center;
  font-variant-numeric:tabular-nums}
.stp__n[data-zero="1"]{color:var(--line)}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--ink);color:var(--label);
  transform:translateY(105%);transition:transform .28s cubic-bezier(.3,.8,.3,1)}
.bar--on{transform:translateY(0)}
.bar__in{max-width:620px;margin:0 auto;padding:13px 18px;
  padding-bottom:calc(13px + env(safe-area-inset-bottom));
  display:flex;align-items:center;justify-content:space-between;gap:14px}
.bar__c{font-family:'DM Mono',monospace;font-size:12px;opacity:.72}
.bar__t{font-family:'DM Mono',monospace;font-size:20px;font-weight:500;margin-top:2px}
.btn{background:var(--yolk);color:var(--ink);border:none;border-radius:var(--r);
  font-family:'Instrument Sans',sans-serif;font-weight:600;font-size:15px;
  padding:13px 20px;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.5;cursor:wait}
.btn:focus-visible{outline:2px solid var(--label);outline-offset:2px}
.btn--wide{width:100%;padding:15px}
.btn--ghost{background:none;color:var(--ink-soft);border:1px solid var(--line);font-weight:500}
.btn--dark{background:var(--ink);color:var(--label)}

.sheet{position:fixed;inset:0;z-index:60;background:rgba(14,42,43,.5);display:none;
  align-items:flex-end;justify-content:center}
.sheet--on{display:flex}
.sheet__card{background:var(--frost);width:100%;max-width:620px;max-height:92vh;overflow-y:auto;
  border-radius:12px 12px 0 0;padding:22px 18px 30px;animation:up .3s cubic-bezier(.3,.8,.3,1)}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:translateY(0);opacity:1}}
.sheet__hd{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:22px;margin-bottom:3px}
.sheet__sb{font-family:'DM Mono',monospace;font-size:11.5px;color:var(--ink-soft);margin-bottom:20px}

.recap{border-top:1px solid var(--line);margin-bottom:20px}
.recap__r{display:flex;justify-content:space-between;gap:12px;padding:9px 0;
  border-bottom:1px solid var(--line);font-size:14.5px}
.recap__q{font-family:'DM Mono',monospace;color:var(--ink-soft);margin-right:7px}
.recap__v{font-family:'DM Mono',monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
.recap__tot{display:flex;justify-content:space-between;padding:12px 0;font-weight:600}
.recap__tot span:last-child{font-family:'DM Mono',monospace;font-size:19px}

.fld{margin-bottom:15px}
.fld label{display:block;font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px}
.fld input,.fld textarea{width:100%;font-family:'Instrument Sans',sans-serif;font-size:16px;
  color:var(--ink);background:var(--label);border:1px solid var(--line);
  border-radius:var(--r);padding:11px 12px}
.fld input:focus,.fld textarea:focus{outline:2px solid var(--yolk);outline-offset:-1px;border-color:var(--ink)}
.fld textarea{resize:vertical;min-height:62px}
.hint{font-family:'DM Mono',monospace;font-size:11px;color:var(--ink-soft);margin-top:6px;display:none}
.hint--on{display:block}
.nota{font-family:'DM Mono',monospace;font-size:11px;color:var(--ink-soft);
  margin-top:8px;display:none}
.nota--on{display:block}

.dates{display:flex;gap:7px;overflow-x:auto;padding-bottom:5px;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.date{flex:0 0 auto;background:var(--label);border:1px solid var(--line);border-radius:var(--r);
  padding:9px 12px;cursor:pointer;text-align:center;min-width:76px}
.date--on{background:var(--ink);border-color:var(--ink);color:var(--label)}
.date--comb{border-style:dashed}
.date:focus-visible{outline:2px solid var(--yolk);outline-offset:2px}
.date__t{font-family:'DM Mono',monospace;font-size:12.5px;letter-spacing:.04em}

.err{color:var(--stamp);font-size:13.5px;margin-bottom:12px;display:none;
  background:#fff;border-left:3px solid var(--stamp);padding:10px 12px;border-radius:2px}
.err--on{display:block}

.state{padding:60px 0;text-align:center}
.state__t{font-family:'Bricolage Grotesque',sans-serif;font-size:20px;font-weight:600;margin-bottom:8px}
.state__d{color:var(--ink-soft);font-size:14.5px;max-width:340px;margin:0 auto 20px}
.skel{background:var(--frost-deep);border-radius:var(--r);height:66px;margin-bottom:8px;
  animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:.85}}

.ok__mark{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:38px;
  line-height:1;letter-spacing:-.03em;margin-bottom:10px}
.ok__id{font-family:'DM Mono',monospace;font-size:12px;color:var(--ink-soft);
  border:1px solid var(--line);display:inline-block;padding:5px 10px;border-radius:2px;margin-bottom:20px}
.pix{background:var(--label);border:1px solid var(--line);border-radius:var(--r);
  padding:13px;margin:16px 0;font-family:'DM Mono',monospace;font-size:13px;word-break:break-all}
.zaps{display:grid;gap:8px}
.zaps__l{font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-soft);margin-bottom:2px}
.foot{text-align:center;font-family:'DM Mono',monospace;font-size:11px;color:var(--ink-soft);padding:40px 0 10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.bar{transform:translateY(0)}}
</style>
</head>
<body>

<header class="fh">
  <div class="wrap">
    <div class="fh__mark">Fregonesi</div>
    <div class="fh__sub">Pastifício · massas</div>
    <div class="fh__freezer" id="freezerLine" style="display:none">
      <b id="freezerN">0</b> unidades prontas hoje
    </div>
  </div>
</header>

<nav class="nav" id="navBox" aria-label="Categorias" style="display:none">
  <div class="nav__in" id="nav"></div>
</nav>

<main class="wrap" id="app">
  <div class="state"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
</main>

<p class="foot" id="foot" style="display:none">
  Escolha os itens, depois a data de entrega.<br>Seu pedido fica reservado assim que você confirmar.
</p>

<div class="bar" id="bar">
  <div class="bar__in">
    <div>
      <div class="bar__c" id="barC">0 itens</div>
      <div class="bar__t" id="barT">R$ 0,00</div>
    </div>
    <button class="btn" id="goCheckout">Continuar</button>
  </div>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT">
  <div class="sheet__card">
    <div class="sheet__hd" id="shT">Fechar pedido</div>
    <div class="sheet__sb" id="shV">Atendimento</div>
    <div class="recap" id="recap"></div>

    <div class="fld">
      <label for="f-tel">WhatsApp</label>
      <input id="f-tel" inputmode="tel" placeholder="11 99999-9999" autocomplete="tel">
      <div class="hint" id="hintCli"></div>
    </div>
    <div class="fld"><label for="f-nome">Seu nome</label><input id="f-nome" autocomplete="name"></div>
    <div class="fld"><label for="f-end">Endereço de entrega</label><textarea id="f-end" autocomplete="street-address"></textarea></div>
    <div class="fld">
      <label>Data de entrega</label>
      <div class="dates" id="dates"></div>
      <div class="nota" id="notaComb">Combinamos a data com você pelo WhatsApp. O pedido já fica reservado.</div>
    </div>
    <div class="fld"><label for="f-obs">Observações (opcional)</label><textarea id="f-obs"></textarea></div>

    <div class="err" id="err"></div>
    <button class="btn btn--wide" id="send">Confirmar pedido</button>
    <button class="btn btn--wide btn--ghost" id="back" style="margin-top:9px">Voltar ao cardápio</button>
  </div>
</div>

<script>
/* ============================================================
   ↓↓↓ COLE AQUI A URL DO APP DA WEB (Apps Script) ↓↓↓
   ============================================================ */
  const API = 'https://script.google.com/macros/s/AKfycbx5vWMbYU2krZW5N-BuwzKwTLbT6Lm21CGRfEhpfqUD2tX0CVhF3WIJTYJnVPzJHPQK/exec'

/* Usados só se a API não responder. Os números oficiais vêm da
   aba Config da planilha (fone_joao / fone_vitor). */
const FONE_FALLBACK = { joao: '5511945508235', vitor: '5511900000000' };

const NOMES = { joao: 'João', vitor: 'Vitor' };
const ORDEM_CAT = ['Lasanha','Sofiatelli','Rondelle','Sorrentino','Cannelloni','Panqueca','Molho'];

/* ============================================================ */
const VEND = (new URLSearchParams(location.search).get('v') || 'joao').toLowerCase() === 'vitor' ? 'vitor' : 'joao';
const OUTRO = VEND === 'joao' ? 'vitor' : 'joao';
const cart = {};
let PROD = {}, FONES = Object.assign({}, FONE_FALLBACK), dataSel = null, enviando = false;
const idem = 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2, 9);

const brl = n => 'R$ ' + Number(n).toFixed(2).replace('.', ',');
const $ = id => document.getElementById(id);
const fone = k => (FONES[k] || FONE_FALLBACK[k] || FONE_FALLBACK.joao);

carregar();

async function carregar() {
  try {
    const r = await fetch(API + '?t=' + Date.now(), { redirect: 'follow' });
    const d = await r.json();
    if (!d.ok) throw new Error(d.erro || 'resposta inválida');
    if (d.fones) FONES = Object.assign({}, FONE_FALLBACK, limparFones(d.fones));
    if (!d.loja_aberta) return telaFechada();
    if (!d.produtos.length) return telaVazia();
    montar(d);
  } catch (err) {
    telaErro();
  }
}

function limparFones(f) {
  const out = {};
  Object.keys(f || {}).forEach(k => {
    const n = String(f[k] || '').replace(/\D/g, '');
    if (n.length >= 12) out[k] = n;      // 55 + DDD + número
  });
  return out;
}

function montar(d) {
  PROD = {};
  d.produtos.forEach(p => { PROD[p.id] = p; });

  const grupos = {};
  d.produtos.forEach(p => { (grupos[p.categoria] = grupos[p.categoria] || []).push(p); });
  const cats = Object.keys(grupos).sort((a, b) => {
    const ia = ORDEM_CAT.indexOf(a), ib = ORDEM_CAT.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });

  const app = $('app'); app.innerHTML = '';
  const nav = $('nav'); nav.innerHTML = '';
  let freezer = 0;

  cats.forEach(cat => {
    const itens = grupos[cat];
    freezer += itens.reduce((s, i) => s + i.estoque, 0);
    const id = 'c-' + cat.toLowerCase().replace(/\W/g, '');

    const b = document.createElement('button');
    b.textContent = cat;
    b.onclick = () => $(id).scrollIntoView({ behavior: 'smooth', block: 'start' });
    nav.appendChild(b);

    const sec = document.createElement('section');
    sec.className = 'sec'; sec.id = id;
    sec.innerHTML = `<div class="sec__hd">
        <h2 class="sec__name">${esc(cat)}</h2>
        <span class="sec__meta">${esc(itens[0].peso)}</span></div>`;
    itens.forEach(p => sec.appendChild(linhaProduto(p)));
    app.appendChild(sec);
  });

  $('freezerN').textContent = freezer;
  $('freezerLine').style.display = 'flex';
  $('navBox').style.display = 'block';
  $('foot').style.display = 'block';

  montarDatas(d.datas, d.permite_combinar !== false);
  $('shV').textContent = 'Atendimento · ' + NOMES[VEND];
}

function linhaProduto(p) {
  const out = p.estoque === 0;
  const row = document.createElement('article');
  row.className = 'item' + (out ? ' item--out' : '');
  row.innerHTML = `
    <div>
      <div class="item__nm">${esc(p.sabor)}</div>
      <div class="item__ln">
        <span class="item__pr">${brl(p.preco)}</span><span class="dot"></span>
        ${out ? '<span class="gone">acabou</span>'
              : `<span class="${p.estoque <= 3 ? 'low' : ''}">${p.estoque} no freezer</span>`}
      </div>
    </div>
    <div class="stp">
      <button aria-label="Tirar um ${esc(p.sabor)}" ${out ? 'disabled' : ''}>−</button>
      <span class="stp__n" data-zero="1">0</span>
      <button aria-label="Somar um ${esc(p.sabor)}" ${out ? 'disabled' : ''}>+</button>
    </div>`;

  const n = row.querySelector('.stp__n');
  const [minus, plus] = row.querySelectorAll('.stp button');
  minus.disabled = true;

  const paint = () => {
    const v = cart[p.id] || 0;
    n.textContent = v;
    n.dataset.zero = v === 0 ? '1' : '0';
    minus.disabled = v === 0;
    plus.disabled = out || v >= p.estoque;
    row.classList.toggle('item--picked', v > 0);
    redraw();
  };
  plus.onclick = () => { const v = cart[p.id] || 0; if (v < p.estoque) { cart[p.id] = v + 1; paint(); } };
  minus.onclick = () => { const v = cart[p.id] || 0; if (v > 0) { if (v === 1) delete cart[p.id]; else cart[p.id] = v - 1; paint(); } };
  return row;
}

function itens() { return Object.keys(cart).map(id => ({ id: id, qtd: cart[id], p: PROD[id] })); }
function soma() { return itens().reduce((s, l) => s + l.p.preco * l.qtd, 0); }
function pecas() { return itens().reduce((s, l) => s + l.qtd, 0); }
function redraw() {
  const p = pecas();
  $('bar').classList.toggle('bar--on', p > 0);
  $('barC').textContent = p + (p === 1 ? ' item' : ' itens');
  $('barT').textContent = brl(soma());
}

function montarDatas(datas, permiteCombinar) {
  const box = $('dates'); box.innerHTML = '';
  const opcoes = (datas || []).slice();
  if (permiteCombinar) opcoes.push({ data: 'combinar', rotulo: 'A combinar' });

  if (!opcoes.length) {
    box.innerHTML = '<span class="sec__meta">Sem datas abertas no momento.</span>';
    return;
  }

  opcoes.forEach((dt, ix) => {
    const b = document.createElement('button');
    b.className = 'date' + (dt.data === 'combinar' ? ' date--comb' : '');
    b.type = 'button';
    b.innerHTML = `<div class="date__t">${esc(dt.rotulo)}</div>`;
    b.onclick = () => {
      document.querySelectorAll('.date').forEach(x => x.classList.remove('date--on'));
      b.classList.add('date--on');
      dataSel = dt.data;
      $('notaComb').classList.toggle('nota--on', dt.data === 'combinar');
    };
    box.appendChild(b);
    if (ix === 0) b.click();
  });
}

$('goCheckout').onclick = () => {
  $('recap').innerHTML = itens().map(l => `
    <div class="recap__r">
      <span><span class="recap__q">${l.qtd}×</span>${esc(l.p.categoria)} ${esc(l.p.sabor)}<br>
        <span style="font-size:12px;color:var(--ink-soft)">${esc(l.p.peso)}</span></span>
      <span class="recap__v">${brl(l.p.preco * l.qtd)}</span>
    </div>`).join('') +
    `<div class="recap__tot"><span>Total</span><span>${brl(soma())}</span></div>`;
  $('sheet').classList.add('sheet--on');
  document.body.style.overflow = 'hidden';
};
function fechar() { $('sheet').classList.remove('sheet--on'); document.body.style.overflow = ''; }
$('back').onclick = fechar;
$('sheet').onclick = e => { if (e.target === $('sheet')) fechar(); };
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('sheet').classList.contains('sheet--on')) fechar();
});

$('f-tel').addEventListener('blur', async () => {
  const tel = $('f-tel').value.replace(/\D/g, '');
  if (tel.length < 10) return;
  try {
    const r = await fetch(API + '?telefone=' + tel, { redirect: 'follow' });
    const d = await r.json();
    if (d.ok && d.cliente) {
      if (!$('f-nome').value) $('f-nome').value = d.cliente.nome || '';
      if (!$('f-end').value)  $('f-end').value  = d.cliente.endereco || '';
      const h = $('hintCli');
      h.textContent = 'Bem-vindo de volta, ' + String(d.cliente.nome).split(' ')[0] + '.';
      h.classList.add('hint--on');
    }
  } catch (e) { /* silêncio: é só uma conveniência */ }
});

$('send').onclick = async () => {
  if (enviando) return;
  const nome = $('f-nome').value.trim();
  const tel  = $('f-tel').value.trim();
  const end  = $('f-end').value.trim();
  const obs  = $('f-obs').value.trim();
  const err  = $('err');

  let falta = null;
  if (!dataSel) falta = 'Escolha a data de entrega.';
  else if (tel.replace(/\D/g, '').length < 10) falta = 'Digite um WhatsApp com DDD.';
  else if (!nome) falta = 'Preencha seu nome.';
  else if (!end)  falta = 'Preencha o endereço de entrega.';
  if (falta) { err.textContent = falta; err.classList.add('err--on'); return; }
  err.classList.remove('err--on');

  enviando = true;
  $('send').disabled = true;
  $('send').textContent = 'Enviando…';

  try {
    const r = await fetch(API, {
      method: 'POST',
      redirect: 'follow',
      body: JSON.stringify({
        idem: idem, vendedor: VEND, nome: nome, telefone: tel,
        endereco: end, obs: obs, data_entrega: dataSel,
        itens: itens().map(l => ({ id: l.id, qtd: l.qtd })),
      }),
    });
    const d = await r.json();
    if (!d.ok) {
      err.textContent = d.erro || 'Não deu pra registrar. Tente de novo.';
      err.classList.add('err--on');
      return;
    }
    if (d.fones) FONES = Object.assign({}, FONES, limparFones(d.fones));
    telaOk(d);
  } catch (e) {
    err.innerHTML = 'Sem conexão com o sistema. ' +
      '<a href="' + linkWhats(nome, tel, end, obs) + '" target="_blank" style="color:var(--stamp)">' +
      'Toque aqui para enviar pelo WhatsApp.</a>';
    err.classList.add('err--on');
  } finally {
    enviando = false;
    $('send').disabled = false;
    $('send').textContent = 'Confirmar pedido';
  }
};

function telaOk(d) {
  fechar();
  $('navBox').style.display = 'none';
  $('freezerLine').style.display = 'none';
  $('foot').style.display = 'none';
  $('bar').classList.remove('bar--on');
  window.scrollTo(0, 0);

  const combinar = (d.combinar === true) || (d.data_entrega === 'combinar');
  const qtd = pecas();
  const linhas = d.itens.map(i => `${i.qtd}x ${i.categoria} ${i.sabor} ${i.peso}`).join('%0A');
  const base = `Oi! Acabei de fazer o pedido *${d.pedido_id}* pelo site.%0A%0A${linhas}%0A%0ATotal: ${brl(d.total)}`;
  const msg = combinar ? base + '%0A%0APodemos combinar a data de entrega?' : base;

  const frase = combinar
    ? `Separamos ${qtd} ${qtd === 1 ? 'item' : 'itens'} no freezer. Total de <b>${brl(d.total)}</b>.
       Agora é só <b>combinar a data</b> com a gente pelo WhatsApp.`
    : `Separamos ${qtd} ${qtd === 1 ? 'item' : 'itens'} no freezer para
       <b>${esc(rotuloDe(d.data_entrega))}</b>. Total de <b>${brl(d.total)}</b>.`;

  $('app').innerHTML = `
    <div class="state" style="text-align:left">
      <div class="ok__mark">Pedido<br>reservado.</div>
      <div class="ok__id">${esc(d.pedido_id)}</div>
      <p class="state__d" style="margin:0 0 18px;max-width:none">${frase}</p>
      ${d.chave_pix ? `<div class="pix"><b>Pix</b><br>${esc(d.chave_pix)}</div>` : ''}
      <div class="zaps">
        <div class="zaps__l">${combinar ? 'Combine a data com a gente' : 'Qualquer dúvida, fale com a gente'}</div>
        <a class="btn btn--wide" style="display:block;text-align:center;text-decoration:none"
           href="https://wa.me/${fone(VEND)}?text=${msg}" target="_blank">
           Falar com ${esc(NOMES[VEND])}</a>
        <a class="btn btn--wide btn--dark" style="display:block;text-align:center;text-decoration:none"
           href="https://wa.me/${fone(OUTRO)}?text=${msg}" target="_blank">
           Falar com ${esc(NOMES[OUTRO])}</a>
        <button class="btn btn--wide btn--ghost" onclick="location.reload()">Fazer outro pedido</button>
      </div>
    </div>`;
}

function contatos() {
  return `<p style="margin-top:16px;display:flex;gap:14px;justify-content:center">
      <a href="https://wa.me/${fone('joao')}" style="color:var(--ink-soft);font-size:14px">Chamar João</a>
      <a href="https://wa.me/${fone('vitor')}" style="color:var(--ink-soft);font-size:14px">Chamar Vitor</a>
    </p>`;
}
function telaErro() {
  $('app').innerHTML = `
    <div class="state">
      <div class="state__t">O cardápio não carregou</div>
      <p class="state__d">Pode ser a sua internet. Tente de novo, ou fale
        direto com a gente que anotamos o pedido na hora.</p>
      <button class="btn" onclick="location.reload()">Tentar de novo</button>
      ${contatos()}
    </div>`;
}
function telaFechada() {
  $('app').innerHTML = `
    <div class="state">
      <div class="state__t">Não estamos aceitando pedidos agora</div>
      <p class="state__d">Volte em breve — ou mande mensagem que a gente avisa
        assim que abrir de novo.</p>
      ${contatos()}
    </div>`;
}
function telaVazia() {
  $('app').innerHTML = `
    <div class="state">
      <div class="state__t">O freezer está vazio</div>
      <p class="state__d">A produção da semana ainda não entrou. Fale com a gente
        para saber quando chega.</p>
      ${contatos()}
    </div>`;
}

function linkWhats(nome, tel, end, obs) {
  const linhas = itens().map(l => `${l.qtd}x ${l.p.categoria} ${l.p.sabor} ${l.p.peso} - ${brl(l.p.preco * l.qtd)}`).join('\n');
  const msg = `*PEDIDO — FREGONESI*\n\nCliente: ${nome}\nWhatsApp: ${tel}\nEntrega: ${rotuloDe(dataSel)}\nEndereço: ${end}\n\n${linhas}\n\n*TOTAL: ${brl(soma())}*${obs ? '\nObs: ' + obs : ''}`;
  return 'https://wa.me/' + fone(VEND) + '?text=' + encodeURIComponent(msg);
}
function rotuloDe(iso) {
  if (!iso) return '';
  if (iso === 'combinar') return 'a combinar';
  const p = String(iso).split('-');
  const d = new Date(+p[0], +p[1] - 1, +p[2]);
  const sem = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
  return sem[d.getDay()] + ', ' + p[2] + '/' + p[1];
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
</script>
</body>
</html>
